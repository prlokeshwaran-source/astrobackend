spring.application.name=astro

# Local default database. Override these values with DB_URL, DB_USERNAME, and DB_PASSWORD
# to connect to MySQL or another supported database.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/astro;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Demo credentials: change these before using the application.
app.auth.admin.email=admin@astro.com
app.auth.admin.password=Admin@123
app.auth.astrologer.email=astrologer@astro.com
app.auth.astrologer.password=Astro@123

# Set OPENAI_API_KEY in the environment to enable AI-written astrology readings.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

